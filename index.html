<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprite Sheet Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Sprite Sheet Editor</h1>
      <p>스프라이트 시트를 업로드하고 프레임 분할, 재생, 재배치, PNG 내보내기를 할 수 있는 웹 기반 편집기입니다.</p>
    </div>
  </header>

  <main class="app-layout">
    <section class="panel">
      <div class="panel-title">1. 이미지 / 분할 설정</div>
      <div class="panel-body controls">
        <label>
          이미지 업로드
          <input id="fileInput" type="file" accept="image/*">
        </label>

        <div class="grid-2">
          <label>프레임 너비 <input id="frameWidthInput" type="number" min="1" value="32"></label>
          <label>프레임 높이 <input id="frameHeightInput" type="number" min="1" value="32"></label>
        </div>

        <div class="grid-2">
          <label>열 수 <input id="sourceColsInput" type="number" min="1" value="1"></label>
          <label>행 수 <input id="sourceRowsInput" type="number" min="1" value="1"></label>
        </div>

        <div class="grid-2">
          <label>X 오프셋 <input id="offsetXInput" type="number" min="0" value="0"></label>
          <label>Y 오프셋 <input id="offsetYInput" type="number" min="0" value="0"></label>
        </div>

        <div class="grid-2">
          <label>X 간격 <input id="gapXInput" type="number" min="0" value="0"></label>
          <label>Y 간격 <input id="gapYInput" type="number" min="0" value="0"></label>
        </div>

        <div class="button-row">
          <button id="autoDetectButton" class="primary">자동 추정</button>
          <button id="fitWholeButton">전체 균등 분할</button>
          <button id="sliceButton">프레임 나누기</button>
          <button id="resetButton" class="danger">초기화</button>
        </div>

        <label>
          원본 확대
          <input id="zoomInput" type="range" min="1" max="8" value="2">
        </label>

        <p class="hint">
          자동 추정은 원본 전체를 균등 분할하는 값을 우선 사용합니다. 원본 캔버스의 파란 프레임을 클릭하면 해당 프레임이 선택되고, Shift+클릭으로 다중 선택할 수 있습니다.
        </p>
        <div id="statusText" class="status"></div>
      </div>
    </section>

    <section class="panel center-panel">
      <div class="panel-title">2. 원본 미리보기</div>
      <div class="stage-wrap">
        <canvas id="sourceCanvas" class="source-canvas"></canvas>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">3. 편집 / 내보내기</div>
      <div class="panel-body controls">
        <div class="preview-box">
          <canvas id="previewCanvas"></canvas>
        </div>

        <div class="button-row">
          <button id="playButton" class="primary">재생</button>
          <button id="stopButton">정지</button>
          <button id="addSelectedButton">선택 추가</button>
          <button id="addAllButton">전체 추가</button>
        </div>

        <div class="grid-2">
          <label>FPS <input id="fpsInput" type="number" min="1" max="60" value="8"></label>
          <label>내보내기 열 수 <input id="exportColsInput" type="number" min="1" value="6"></label>
        </div>

        <div class="button-row">
          <button id="moveOutputLeftButton">앞으로</button>
          <button id="moveOutputRightButton">뒤로</button>
          <button id="removeSelectedOutputButton" class="danger">선택 제거</button>
          <button id="clearOutputButton" class="danger">출력 비우기</button>
          <button id="exportButton" class="primary">PNG 내보내기</button>
        </div>

        <div>
          <div class="sub-title">분할된 프레임</div>
          <div id="frameList" class="frame-list"></div>
        </div>

        <div>
          <div class="sub-title">출력 순서</div>
          <div id="outputList" class="output-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
