<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprite Sheet Editor</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:20px;border-bottom:1px solid #374151}h1{margin:0 0 6px;font-size:28px}p{margin:0;color:#9ca3af}.layout{display:grid;grid-template-columns:320px 1fr 360px;gap:14px;padding:14px}.panel{background:#1f2937;border:1px solid #374151;border-radius:14px;overflow:hidden}.title{padding:12px 14px;background:#263244;font-weight:800;border-bottom:1px solid #374151}.body{padding:14px;display:flex;flex-direction:column;gap:12px}label{display:block;font-size:13px;color:#cbd5e1;font-weight:700}input{width:100%;margin-top:5px;padding:8px;border-radius:8px;border:1px solid #4b5563;background:#0f172a;color:#e5e7eb}button{padding:9px 10px;border-radius:9px;border:1px solid #4b5563;background:#374151;color:#e5e7eb;cursor:pointer;font-weight:700}button:hover{border-color:#60a5fa}.primary{background:#60a5fa;color:#06111f;border-color:#60a5fa}.danger{border-color:#f87171;color:#fecaca}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;flex-wrap:wrap;gap:8px}.row button{flex:1}.stage{height:calc(100vh - 140px);min-height:520px;overflow:auto;padding:12px;background:#0f172a}.checker{background-color:#0f172a;background-image:linear-gradient(45deg,rgba(255,255,255,.06) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.06) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.06) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.06) 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}canvas{image-rendering:pixelated}.source{border:1px solid #4b5563}.preview{display:grid;place-items:center;min-height:150px;border:1px solid #4b5563;border-radius:12px}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;max-height:220px;overflow:auto;padding:8px;border:1px solid #4b5563;border-radius:10px;background:#111827}.card{position:relative;display:grid;place-items:center;min-height:54px;border:1px solid #4b5563;border-radius:8px;background:#243044;cursor:pointer}.card.selected{outline:2px solid #60a5fa}.card canvas{max-width:44px;max-height:44px}.badge{position:absolute;left:3px;top:3px;font-size:10px;background:rgba(0,0,0,.65);padding:1px 4px;border-radius:999px}.status{min-height:22px;color:#86efac;font-size:13px;line-height:1.4}.small{font-size:12px;color:#9ca3af;line-height:1.5}@media(max-width:1100px){.layout{grid-template-columns:1fr}.stage{height:auto}}
  </style>
</head>
<body>
  <header>
    <h1>Sprite Sheet Editor</h1>
    <p>업로드 → 프레임 분할 → 선택/재배치 → 재생 → PNG 내보내기</p>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="title">1. 분할 설정</div>
      <div class="body">
        <label>이미지 업로드 <input id="file" type="file" accept="image/*"></label>
        <div class="grid2">
          <label>프레임 너비 <input id="fw" type="number" min="1" value="32"></label>
          <label>프레임 높이 <input id="fh" type="number" min="1" value="32"></label>
        </div>
        <div class="grid2">
          <label>열 수 <input id="cols" type="number" min="1" value="1"></label>
          <label>행 수 <input id="rows" type="number" min="1" value="1"></label>
        </div>
        <div class="grid2">
          <label>X 오프셋 <input id="ox" type="number" min="0" value="0"></label>
          <label>Y 오프셋 <input id="oy" type="number" min="0" value="0"></label>
        </div>
        <div class="grid2">
          <label>X 간격 <input id="gx" type="number" min="0" value="0"></label>
          <label>Y 간격 <input id="gy" type="number" min="0" value="0"></label>
        </div>
        <label>원본 확대 <input id="zoom" type="range" min="1" max="8" value="2"></label>
        <div class="row">
          <button id="test" type="button">동작 테스트</button>
          <button id="fit" type="button" class="primary">전체 균등 분할</button>
          <button id="slice" type="button">프레임 나누기</button>
          <button id="reset" type="button" class="danger">초기화</button>
        </div>
        <div id="status" class="status">로딩 중...</div>
        <p class="small">원본 캔버스나 프레임 목록에서 프레임을 클릭해 선택합니다. Shift+클릭은 다중 선택입니다.</p>
      </div>
    </section>

    <section class="panel">
      <div class="title">2. 원본</div>
      <div class="stage checker"><canvas id="source" class="source"></canvas></div>
    </section>

    <section class="panel">
      <div class="title">3. 편집 / 출력</div>
      <div class="body">
        <div class="preview checker"><canvas id="preview"></canvas></div>
        <div class="row">
          <button id="play" type="button" class="primary">재생</button>
          <button id="stop" type="button">정지</button>
          <button id="addSelected" type="button">선택 추가</button>
          <button id="addAll" type="button">전체 추가</button>
        </div>
        <div class="grid2">
          <label>FPS <input id="fps" type="number" min="1" max="60" value="8"></label>
          <label>내보내기 열 수 <input id="exportCols" type="number" min="1" value="6"></label>
        </div>
        <div class="row">
          <button id="left" type="button">앞으로</button>
          <button id="right" type="button">뒤로</button>
          <button id="remove" type="button" class="danger">선택 제거</button>
          <button id="clear" type="button" class="danger">출력 비우기</button>
          <button id="export" type="button" class="primary">PNG 내보내기</button>
        </div>
        <div>
          <div class="small">분할된 프레임</div>
          <div id="frames" class="list"></div>
        </div>
        <div>
          <div class="small">출력 순서</div>
          <div id="out" class="list"></div>
        </div>
      </div>
    </section>
  </main>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var el = {
    file:$('file'), fw:$('fw'), fh:$('fh'), cols:$('cols'), rows:$('rows'), ox:$('ox'), oy:$('oy'), gx:$('gx'), gy:$('gy'), zoom:$('zoom'),
    test:$('test'), fit:$('fit'), slice:$('slice'), reset:$('reset'), source:$('source'), preview:$('preview'), status:$('status'),
    frames:$('frames'), out:$('out'), play:$('play'), stop:$('stop'), addSelected:$('addSelected'), addAll:$('addAll'),
    fps:$('fps'), exportCols:$('exportCols'), left:$('left'), right:$('right'), remove:$('remove'), clear:$('clear'), export:$('export')
  };

  var sctx = el.source.getContext('2d', { willReadFrequently:true });
  var pctx = el.preview.getContext('2d');
  var state = { image:null, url:'', frames:[], selected:{}, output:[], selectedOut:-1, timer:0, playing:false, playIndex:0, drag:-1 };

  function n(input, fallback){ var v = parseInt(input.value,10); return isFinite(v) ? v : fallback; }
  function status(t){ el.status.textContent = t; }
  function setting(){ return { fw:Math.max(1,n(el.fw,32)), fh:Math.max(1,n(el.fh,32)), cols:Math.max(1,n(el.cols,1)), rows:Math.max(1,n(el.rows,1)), ox:Math.max(0,n(el.ox,0)), oy:Math.max(0,n(el.oy,0)), gx:Math.max(0,n(el.gx,0)), gy:Math.max(0,n(el.gy,0)) }; }
  function ids(){ return Object.keys(state.selected).map(function(k){ return parseInt(k,10); }); }
  function frameById(id){ for(var i=0;i<state.frames.length;i++){ if(state.frames[i].id===id) return state.frames[i]; } return null; }

  function load(file){
    if(!file) return;
    stop();
    if(state.url) URL.revokeObjectURL(state.url);
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      state.image = img; state.url = url;
      fitWhole(); slice();
      status('로드 완료: ' + file.name + ' / ' + img.naturalWidth + 'x' + img.naturalHeight);
    };
    img.onerror = function(){ status('이미지를 불러오지 못했습니다.'); URL.revokeObjectURL(url); };
    img.src = url;
  }

  function pick(total){
    var sizes=[16,24,32,48,64,96,128,256];
    for(var i=0;i<sizes.length;i++){ if(total % sizes[i]===0 && total/sizes[i]>=2 && total/sizes[i]<=12) return sizes[i]; }
    for(var j=sizes.length-1;j>=0;j--){ if(total % sizes[j]===0) return sizes[j]; }
    return Math.min(total,32);
  }

  function fitWhole(){
    if(!state.image){ status('먼저 이미지를 업로드하세요.'); return; }
    var fw=pick(state.image.naturalWidth), fh=pick(state.image.naturalHeight);
    el.ox.value=0; el.oy.value=0; el.gx.value=0; el.gy.value=0; el.fw.value=fw; el.fh.value=fh;
    el.cols.value=Math.max(1,Math.floor(state.image.naturalWidth/fw));
    el.rows.value=Math.max(1,Math.floor(state.image.naturalHeight/fh));
    drawSource();
    status('전체 균등 분할값 적용: ' + el.cols.value + '열 x ' + el.rows.value + '행');
  }

  function slice(){
    if(!state.image){ status('먼저 이미지를 업로드하세요.'); return; }
    stop();
    var a=setting(), list=[], id=0;
    for(var r=0;r<a.rows;r++){
      for(var c=0;c<a.cols;c++){
        var sx=a.ox+c*(a.fw+a.gx), sy=a.oy+r*(a.fh+a.gy);
        if(sx+a.fw<=state.image.naturalWidth && sy+a.fh<=state.image.naturalHeight){ list.push({id:id++, sx:sx, sy:sy, w:a.fw, h:a.fh}); }
      }
    }
    state.frames=list; state.selected={}; state.output=[]; state.selectedOut=-1; state.playIndex=0;
    renderFrames(); renderOut(); drawSource(); drawPreview(list[0]);
    status(list.length + '개 프레임으로 분할했습니다.');
  }

  function drawSource(){
    if(!state.image){ sctx.clearRect(0,0,el.source.width,el.source.height); return; }
    var z=Math.max(1,n(el.zoom,2));
    el.source.width=state.image.naturalWidth*z; el.source.height=state.image.naturalHeight*z;
    sctx.imageSmoothingEnabled=false; sctx.clearRect(0,0,el.source.width,el.source.height);
    sctx.drawImage(state.image,0,0,el.source.width,el.source.height);
    var list = state.frames.length ? state.frames : previewFrames();
    sctx.font = Math.max(10,10*z) + 'px sans-serif';
    for(var i=0;i<list.length;i++){
      var f=list[i];
      sctx.strokeStyle='rgba(96,165,250,.95)'; sctx.lineWidth=1;
      sctx.strokeRect(f.sx*z+.5,f.sy*z+.5,f.w*z,f.h*z);
      if(state.selected[f.id]){ sctx.fillStyle='rgba(96,165,250,.22)'; sctx.fillRect(f.sx*z,f.sy*z,f.w*z,f.h*z); }
      sctx.fillStyle='rgba(0,0,0,.7)'; sctx.fillRect(f.sx*z+2,f.sy*z+2,28,16);
      sctx.fillStyle='#fff'; sctx.fillText(String(f.id),f.sx*z+6,f.sy*z+14);
    }
  }

  function previewFrames(){
    if(!state.image) return [];
    var a=setting(), list=[], id=0;
    for(var r=0;r<a.rows;r++) for(var c=0;c<a.cols;c++){
      var sx=a.ox+c*(a.fw+a.gx), sy=a.oy+r*(a.fh+a.gy);
      if(sx+a.fw<=state.image.naturalWidth && sy+a.fh<=state.image.naturalHeight) list.push({id:id++, sx:sx, sy:sy, w:a.fw, h:a.fh});
    }
    return list;
  }

  function drawPreview(f){
    if(!state.image || !f){ pctx.clearRect(0,0,el.preview.width,el.preview.height); return; }
    var sc=Math.max(1,Math.min(8,Math.floor(128/Math.max(f.w,f.h))));
    el.preview.width=f.w*sc; el.preview.height=f.h*sc;
    pctx.imageSmoothingEnabled=false; pctx.clearRect(0,0,el.preview.width,el.preview.height);
    pctx.drawImage(state.image,f.sx,f.sy,f.w,f.h,0,0,el.preview.width,el.preview.height);
  }

  function makeCard(f,label,cls){
    var d=document.createElement('div'); d.className='card '+(cls||'');
    var c=document.createElement('canvas'); c.width=f.w; c.height=f.h;
    var x=c.getContext('2d'); x.imageSmoothingEnabled=false; x.drawImage(state.image,f.sx,f.sy,f.w,f.h,0,0,f.w,f.h);
    var b=document.createElement('span'); b.className='badge'; b.textContent=label;
    d.appendChild(c); d.appendChild(b); return d;
  }

  function selectFrame(f,multi){
    if(!multi) state.selected={};
    if(multi && state.selected[f.id]) delete state.selected[f.id]; else state.selected[f.id]=true;
    drawPreview(f); renderFrames(); drawSource();
  }

  function renderFrames(){
    el.frames.innerHTML='';
    for(var i=0;i<state.frames.length;i++){
      (function(f){
        var card=makeCard(f,f.id,''); if(state.selected[f.id]) card.classList.add('selected');
        card.onclick=function(ev){ selectFrame(f,ev.shiftKey); };
        card.ondblclick=function(){ addOutput([f.id]); };
        el.frames.appendChild(card);
      })(state.frames[i]);
    }
  }

  function addOutput(arr){
    var added=0;
    for(var i=0;i<arr.length;i++){ if(frameById(arr[i])){ state.output.push(arr[i]); added++; } }
    if(state.selectedOut<0 && state.output.length) state.selectedOut=0;
    renderOut(); status(added + '개 프레임을 출력에 추가했습니다.');
  }

  function renderOut(){
    el.out.innerHTML='';
    for(var i=0;i<state.output.length;i++){
      (function(index){
        var f=frameById(state.output[index]); if(!f) return;
        var card=makeCard(f,index+1,''); if(state.selectedOut===index) card.classList.add('selected');
        card.draggable=true;
        card.onclick=function(){ state.selectedOut=index; drawPreview(f); renderOut(); };
        card.ondragstart=function(){ state.drag=index; };
        card.ondragover=function(ev){ ev.preventDefault(); };
        card.ondrop=function(ev){ ev.preventDefault(); moveOut(state.drag,index); };
        el.out.appendChild(card);
      })(i);
    }
  }

  function moveOut(from,to){
    if(from<0 || to<0 || from>=state.output.length || to>=state.output.length || from===to) return;
    var item=state.output.splice(from,1)[0]; state.output.splice(to,0,item); state.selectedOut=to; renderOut();
  }

  function stop(){ state.playing=false; clearTimeout(state.timer); }
  function play(){
    if(state.playing) return;
    if(!state.output.length){ status('출력 순서에 프레임을 먼저 추가하세요.'); return; }
    state.playing=true;
    var tick=function(){
      if(!state.playing) return;
      var idx=state.playIndex%state.output.length; state.selectedOut=idx;
      drawPreview(frameById(state.output[idx])); renderOut(); state.playIndex++;
      state.timer=setTimeout(tick,1000/Math.max(1,Math.min(60,n(el.fps,8))));
    };
    tick();
  }

  function exportPng(){
    if(!state.output.length){ status('내보낼 프레임이 없습니다.'); return; }
    var first=frameById(state.output[0]); if(!first) return;
    var cols=Math.max(1,Math.min(state.output.length,n(el.exportCols,6))), rows=Math.ceil(state.output.length/cols);
    var out=document.createElement('canvas'); out.width=first.w*cols; out.height=first.h*rows;
    var ctx=out.getContext('2d'); ctx.imageSmoothingEnabled=false;
    for(var i=0;i<state.output.length;i++){
      var f=frameById(state.output[i]); if(!f) continue;
      ctx.drawImage(state.image,f.sx,f.sy,f.w,f.h,(i%cols)*first.w,Math.floor(i/cols)*first.h,first.w,first.h);
    }
    var a=document.createElement('a'); a.download='sprite-sheet-'+cols+'x'+rows+'.png'; a.href=out.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove();
    status('PNG 내보내기 완료: '+out.width+'x'+out.height);
  }

  function reset(){ stop(); state.frames=[]; state.selected={}; state.output=[]; state.selectedOut=-1; renderFrames(); renderOut(); drawSource(); drawPreview(null); status('초기화 완료'); }

  el.file.addEventListener('change',function(ev){ load(ev.target.files[0]); });
  el.test.addEventListener('click',function(){ status('버튼 동작 정상. 이제 이미지 업로드를 눌러보세요.'); });
  el.fit.addEventListener('click',function(){ fitWhole(); slice(); });
  el.slice.addEventListener('click',slice);
  el.reset.addEventListener('click',reset);
  el.play.addEventListener('click',play);
  el.stop.addEventListener('click',function(){ stop(); status('재생 정지'); });
  el.addSelected.addEventListener('click',function(){ addOutput(ids()); });
  el.addAll.addEventListener('click',function(){ addOutput(state.frames.map(function(f){ return f.id; })); });
  el.left.addEventListener('click',function(){ moveOut(state.selectedOut,state.selectedOut-1); });
  el.right.addEventListener('click',function(){ moveOut(state.selectedOut,state.selectedOut+1); });
  el.remove.addEventListener('click',function(){ if(state.selectedOut>=0){ state.output.splice(state.selectedOut,1); state.selectedOut=Math.min(state.selectedOut,state.output.length-1); renderOut(); } });
  el.clear.addEventListener('click',function(){ state.output=[]; state.selectedOut=-1; renderOut(); status('출력 비움'); });
  el.export.addEventListener('click',exportPng);
  el.zoom.addEventListener('input',drawSource);
  [el.fw,el.fh,el.cols,el.rows,el.ox,el.oy,el.gx,el.gy].forEach(function(input){ input.addEventListener('input',drawSource); });
  el.source.addEventListener('click',function(ev){
    if(!state.frames.length) return;
    var rect=el.source.getBoundingClientRect(), z=Math.max(1,n(el.zoom,2));
    var x=(ev.clientX-rect.left)/z, y=(ev.clientY-rect.top)/z;
    for(var i=0;i<state.frames.length;i++){ var f=state.frames[i]; if(x>=f.sx && x<f.sx+f.w && y>=f.sy && y<f.sy+f.h){ selectFrame(f,ev.shiftKey); return; } }
  });

  status('JS 연결 완료. 버튼이 동작합니다.');
})();
</script>
</body>
</html>
