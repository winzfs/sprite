<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprite Sheet Editor</title>
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Sprite Sheet Editor</h1>
      <p>업로드 → 자동/수동 분할 → 프레임별 위치 보정 → 선택/재배치 → 재생 → PNG 내보내기</p>
    </div>
  </header>

  <main class="app-layout">
    <section class="panel">
      <div class="panel-title">1. 이미지 / 분할 설정</div>
      <div class="panel-body controls">
        <label>이미지 업로드 <input id="fileInput" type="file" accept="image/*"></label>
        <div class="grid-2">
          <label>프레임 너비 <input id="frameWidthInput" type="number" min="1" value="32"></label>
          <label>프레임 높이 <input id="frameHeightInput" type="number" min="1" value="32"></label>
        </div>
        <div class="grid-2">
          <label>열 수 <input id="sourceColsInput" type="number" min="1" value="1"></label>
          <label>행 수 <input id="sourceRowsInput" type="number" min="1" value="1"></label>
        </div>
        <div class="grid-2">
          <label>X 오프셋 <input id="offsetXInput" type="number" min="0" value="0"></label>
          <label>Y 오프셋 <input id="offsetYInput" type="number" min="0" value="0"></label>
        </div>
        <div class="grid-2">
          <label>X 간격 <input id="gapXInput" type="number" min="0" value="0"></label>
          <label>Y 간격 <input id="gapYInput" type="number" min="0" value="0"></label>
        </div>
        <label>원본 확대 <input id="zoomInput" type="range" min="1" max="8" value="2"></label>
        <div class="button-row">
          <button id="testButton" type="button">동작 테스트</button>
          <button id="autoDetectButton" type="button" class="primary">자동 추정</button>
          <button id="fitWholeButton" type="button">전체 균등</button>
          <button id="sliceButton" type="button">프레임 나누기</button>
          <button id="resetButton" type="button" class="danger">초기화</button>
        </div>
        <div id="statusText" class="status">로딩 중...</div>
        <p class="hint">행/열, 프레임 크기, 간격을 바꾸면 프레임이 즉시 다시 나뉩니다.</p>
      </div>
    </section>

    <section class="panel center-panel">
      <div class="panel-title">2. 원본</div>
      <div class="stage-wrap"><canvas id="sourceCanvas" class="source-canvas"></canvas></div>
    </section>

    <section class="panel">
      <div class="panel-title">3. 편집 / 출력</div>
      <div class="panel-body controls">
        <div class="preview-box"><canvas id="previewCanvas"></canvas></div>
        <div class="grid-2">
          <label class="check-label"><input id="showPreviewFrameInput" type="checkbox" checked> 프레임 테두리 표시</label>
          <label class="check-label"><input id="showPreviewCenterInput" type="checkbox" checked> 중앙선 표시</label>
        </div>

        <div>
          <div class="sub-title">선택 프레임 원본 위치 보정</div>
          <div class="nudge-pad">
            <button id="nudgeUpButton" type="button">▲</button>
            <div class="button-row">
              <button id="nudgeLeftButton" type="button">◀</button>
              <button id="nudgeResetButton" type="button" class="danger">보정 초기화</button>
              <button id="nudgeRightButton" type="button">▶</button>
            </div>
            <button id="nudgeDownButton" type="button">▼</button>
          </div>
          <div class="align-row">
            <button id="centerXButton" type="button">좌우 가운데</button>
            <button id="centerYButton" type="button">상하 가운데</button>
            <button id="centerBothButton" type="button" class="primary">가운데 정렬</button>
          </div>
          <div class="grid-2">
            <label>이동 단위(px) <input id="nudgeStepInput" type="number" min="1" value="1"></label>
            <label>현재 보정 <input id="selectedShiftInput" type="text" value="선택 없음" readonly></label>
          </div>
        </div>

        <div class="button-row">
          <button id="playButton" type="button" class="primary">재생</button>
          <button id="stopButton" type="button">정지</button>
          <button id="addSelectedButton" type="button">선택 추가</button>
          <button id="addAllButton" type="button">전체 추가</button>
        </div>
        <div class="grid-2">
          <label>FPS <input id="fpsInput" type="number" min="1" max="60" value="8"></label>
          <label>내보내기 열 수 <input id="exportColsInput" type="number" min="1" value="6"></label>
        </div>
        <div class="grid-2">
          <label>배경색 <input id="exportBgInput" type="color" value="#d9d9d9"></label>
          <label class="check-label"><input id="transparentBgInput" type="checkbox"> 투명 배경</label>
        </div>
        <label class="check-label"><input id="keepSpacingInput" type="checkbox" checked> 원본 오프셋/간격을 출력에도 유지</label>
        <div class="button-row">
          <button id="moveOutputLeftButton" type="button">앞으로</button>
          <button id="moveOutputRightButton" type="button">뒤로</button>
          <button id="removeSelectedOutputButton" type="button" class="danger">선택 제거</button>
          <button id="clearOutputButton" type="button" class="danger">출력 비우기</button>
          <button id="exportButton" type="button" class="primary">PNG 내보내기</button>
        </div>
        <div><div class="sub-title">분할된 프레임</div><div id="frameList" class="frame-list"></div></div>
        <div><div class="sub-title">출력 순서</div><div id="outputList" class="output-list"></div></div>
      </div>
    </section>
  </main>
  <script src="src/app.js?v=13" defer></script>
</body>
</html>
